<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autoy</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header><h1>Autoy</h1><p>多角色自動狩獵</p><span class="badge app-version">v0.6.0</span></header>
      <div class="workspace">
        <aside class="card sidebar" id="hero-panel">
          <div class="heading"><h2>角色</h2><span id="party-summary" class="badge">尚未讀取</span></div>
          <p class="hint">以遊戲目前勾選的出戰角色為準；只在手動讀取、啟動、動作回應與完成時間到時更新。</p>
          <div id="heroes" class="heroes"></div>
        </aside>
        <div class="content">
          <section class="card">
            <div class="heading account-heading"><h2>帳號</h2><button id="stop-all" class="danger">停止全部帳號</button></div>
            <form id="account-form"><input id="account-label" placeholder="帳號別名" maxlength="40" required /><input id="account-token" type="password" placeholder="遊戲 API token" autocomplete="off" required /><button>新增帳號</button></form>
            <div id="accounts"></div>
          </section>
          <section class="card" id="automation-card" hidden>
        <div class="heading"><h2 id="active-label"></h2><span id="run-state" class="badge">已停止</span></div>
        <div class="automation-controls"><div class="control-group"><span class="control-label">目前帳號</span><div class="actions"><button id="refresh">重新讀取</button><button id="start" class="primary">啟動</button><button id="stop" class="danger">停止</button></div></div></div>
        <section class="automation-settings" aria-label="自動狩獵設定">
          <h3>自動狩獵設定</h3>
          <div class="settings">
            <label>目標樓層<input id="target-stage" type="number" min="1" value="1" /></label>
            <label>HP 目標 %<input id="hp-target" type="number" min="1" max="100" value="80" /></label>
            <label>體力 SP 目標 %<input id="sp-target" type="number" min="1" max="100" value="70" /></label>
            <label>休息最小分鐘<input id="rest-minutes" type="number" min="0.1" step="0.1" value="1" /></label>
            <label>無動作提醒分鐘<input id="alert-minutes" type="number" min="1" step="1" value="3" /></label>
          </div>
        </section>
        <div class="actions utility-actions"><button id="open-reports">戰報</button><button id="open-flow">流程訊息</button><button id="open-operations">操作紀錄</button></div>
        <p class="hint">停止後不會背景重新讀取；可按「重新讀取」或直接啟動，Autoy 會先讀取最新名單再判斷。</p>
        <p id="alert" class="alert" hidden></p>
        <div id="death-actions"></div>
          </section>
        </div>
      </div>
    </main>
    <dialog id="flow-card"><div class="dialog-heading"><h2>流程訊息</h2><div class="actions"><label class="checkbox-setting"><input id="flow-messages" type="checkbox" checked /> 啟用流程訊息</label><button id="copy-events">複製訊息</button><button id="clear-events">清除</button><button data-close-dialog>關閉</button></div></div><pre id="events"></pre></dialog>
    <dialog id="operation-card"><div class="dialog-heading"><h2>操作紀錄</h2><div class="actions"><label class="checkbox-setting"><input id="operation-log" type="checkbox" /> 啟用操作紀錄</label><label class="checkbox-setting"><input id="debug-console" type="checkbox" /> Console 除錯</label><button id="copy-operations">複製 JSON</button><button id="clear-operations">清除</button><button data-close-dialog>關閉</button></div></div><p class="hint">只在啟用後記錄 request／response；token、headers、Cookie 與密碼會遮罩。</p><pre id="operations"></pre></dialog>
    <dialog id="reports-dialog"><div class="dialog-heading"><h2>狩獵戰報</h2><div class="actions"><button id="refresh-reports">讀取戰報</button><button data-close-dialog>關閉</button></div></div><p class="hint">只在按下「讀取戰報」時請求列表；點選戰報後才讀取單筆詳情並在遊戲端標記已閱。</p><div class="report-layout"><div id="report-list" class="report-list">尚未讀取戰報。</div><article id="report-detail" class="report-detail">請從左側選擇一筆戰報。</article></div></dialog>
    <script src="./app.js"></script>
  </body>
</html>
