<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autoy</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <header><h1>Autoy</h1><p>多角色自動狩獵</p></header>
      <section class="card">
        <h2>帳號</h2>
        <form id="account-form"><input id="account-label" placeholder="帳號別名" maxlength="40" required /><input id="account-token" type="password" placeholder="Bearer token" autocomplete="off" required /><button>新增帳號</button></form>
        <div id="accounts"></div>
      </section>
      <section class="card" id="automation-card" hidden>
        <div class="heading"><h2 id="active-label"></h2><span id="run-state" class="badge">已停止</span></div>
        <div class="settings">
          <label>目標樓層<input id="target-stage" type="number" min="1" value="1" /></label>
          <label>HP 目標 %<input id="hp-target" type="number" min="1" max="100" value="80" /></label>
          <label>體力 SP 目標 %<input id="sp-target" type="number" min="1" max="100" value="70" /></label>
          <label>休息最小分鐘<input id="rest-minutes" type="number" min="0.1" step="0.1" value="1" /></label>
        </div>
        <div class="actions"><button id="refresh">重新讀取</button><button id="start" class="primary">開始自動狩獵</button><button id="stop" class="danger">停止</button></div>
        <p class="hint">流程：全隊達 HP／SP 目標後，低於目標樓層就前行；到達目標後原地狩獵。API 錯誤時會停止。</p>
        <div id="heroes" class="heroes"></div>
      </section>
      <section class="card"><h2>事件</h2><pre id="events"></pre></section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
